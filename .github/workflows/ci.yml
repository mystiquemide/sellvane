name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  BASE_RPC_URL: https://mainnet.base.org
  TEAM_ACCOUNT_ADDRESS: "0x0DAeA8d6d0CBd842cBE8Df6887E0c1792276E299"
  TOKEN_ADDRESS: "0xe7f3ee414aC0D341763dCE8E3AB6A2f630A8C8Cf"
  POOL_ADDRESS: "0xEE4b9eEB9F2a2de45844d03a70b89416E4620c8A"
  POOL_FEE: "10000"
  SELLER_ADDRESS: "0x719a235Be27F0b7B7F82775aFBEA6a2dE6264fe6"
  TOKEN_DEPLOY_BLOCK: "51773359"

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npx vitest run

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.0.0
      - run: forge build
      - run: forge test --fork-url "$BASE_RPC_URL"
